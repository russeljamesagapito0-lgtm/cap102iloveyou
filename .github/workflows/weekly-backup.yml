name: Weekly Supabase backup

on:
  schedule:
    - cron: "0 18 * * 0" # Sunday 18:00 UTC = Monday 02:00 PH
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_VERSION: "17" # match your Supabase Postgres major version
    steps:
      - uses: actions/checkout@v4

      - name: Install matching pg_dump
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-${PG_VERSION}
          echo "/usr/lib/postgresql/${PG_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./admin/scripts/backup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rootcare-backup-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 90
          if-no-files-found: error
